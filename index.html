
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<title>FSP Apotheker – Premium Lernplattform</title>

<style>
:root{
  --primary:#4f46e5;
  --primary2:#7c3aed;
  --blue:#2563eb;
  --green:#059669;
  --orange:#f59e0b;
  --red:#ef4444;
  --dark:#172033;
  --text:#273248;
  --muted:#6b7280;
  --bg:#f4f6fb;
  --card:#ffffff;
  --border:#e5e7eb;
  --shadow:0 10px 30px rgba(31,41,55,.08);
  --radius:20px;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:820px;
  margin:auto;
  min-height:100vh;
  padding-bottom:100px;
}

/* HEADER */

.hero{
  background:linear-gradient(135deg,#4338ca,#6366f1 48%,#7c3aed);
  color:white;
  padding:28px 20px 25px;
  border-radius:0 0 30px 30px;
  box-shadow:0 12px 35px rgba(79,70,229,.25);
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:15px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.logo h1{
  font-size:24px;
  margin:0;
  letter-spacing:-.5px;
}

.logo p{
  margin:3px 0 0;
  font-size:13px;
  opacity:.85;
}

.premium-status{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  border-radius:999px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.hero-progress{
  margin-top:24px;
}

.hero-progress-top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:7px;
  opacity:.9;
}

.progress{
  height:8px;
  border-radius:99px;
  background:rgba(255,255,255,.2);
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:white;
  border-radius:99px;
  transition:.3s;
}

/* CONTENT */

main{
  padding:18px 15px;
}

.section-title{
  font-size:20px;
  font-weight:850;
  margin:8px 0 5px;
  color:var(--dark);
}

.section-subtitle{
  color:var(--muted);
  font-size:13px;
  margin:0 0 16px;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card h3{
  margin:0 0 7px;
  font-size:17px;
  color:var(--dark);
}

.card p{
  line-height:1.55;
}

.clickable{
  transition:.18s;
}

.clickable:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 35px rgba(31,41,55,.12);
}

.card-header{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.icon-box{
  width:45px;
  height:45px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  background:#eef2ff;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  background:#eef2ff;
  color:var(--primary);
}

.badge.green{
  background:#ecfdf5;
  color:#047857;
}

.badge.orange{
  background:#fff7ed;
  color:#c2410c;
}

.badge.lock{
  background:#f3f4f6;
  color:#4b5563;
}

.badge.premium{
  background:#fef3c7;
  color:#92400e;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.big-number{
  font-size:27px;
  font-weight:900;
  color:var(--dark);
}

/* STATISTICS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:15px 0;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:13px 9px;
  text-align:center;
}

.stat-icon{
  font-size:18px;
}

.stat-value{
  display:block;
  font-size:19px;
  font-weight:900;
  margin-top:4px;
}

.stat-label{
  font-size:10px;
  color:var(--muted);
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:13px;
  padding:11px 14px;
  font-weight:800;
  transition:.18s;
}

.btn:active{
  transform:scale(.97);
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}

.btn-secondary{
  background:#eef2ff;
  color:var(--primary);
}

.btn-light{
  background:#f3f4f6;
  color:#374151;
}

.btn-green{
  color:white;
  background:var(--green);
}

.btn-orange{
  color:white;
  background:var(--orange);
}

.btn-danger{
  color:white;
  background:var(--red);
}

.btn-block{
  width:100%;
}

.button-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

/* LESSONS */

.lesson-card{
  position:relative;
  overflow:hidden;
}

.lesson-number{
  position:absolute;
  right:-4px;
  top:-9px;
  font-size:75px;
  font-weight:900;
  color:#f4f5ff;
  pointer-events:none;
}

.lesson-content{
  position:relative;
  z-index:2;
}

.lesson-progress{
  margin-top:12px;
}

.lesson-progress .progress{
  background:#eef2f7;
}

.lesson-progress .progress > div{
  background:linear-gradient(90deg,var(--primary),var(--primary2));
}

/* PREMIUM */

.premium-banner{
  background:linear-gradient(135deg,#171a3a,#302e81);
  color:white;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}

.premium-banner:after{
  content:"✦";
  position:absolute;
  right:15px;
  top:-8px;
  font-size:90px;
  opacity:.08;
}

.premium-banner h2{
  margin:0 0 7px;
  font-size:22px;
}

.premium-banner p{
  color:#dbeafe;
  font-size:13px;
  line-height:1.5;
  max-width:650px;
}

.premium-features{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin:15px 0;
}

.premium-feature{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  padding:10px;
  border-radius:12px;
  font-size:12px;
}

.locked{
  position:relative;
}

.locked-overlay{
  background:rgba(255,255,255,.82);
  border-radius:16px;
  padding:15px;
  text-align:center;
  border:1px dashed #c7cad4;
}

.lock-icon{
  font-size:27px;
}

/* QUICK ACTION */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  box-shadow:var(--shadow);
}

.quick-icon{
  font-size:25px;
}

.quick strong{
  display:block;
  margin-top:8px;
}

.quick span{
  font-size:11px;
  color:var(--muted);
}

/* QUESTIONS */

.question-card{
  background:white;
  border-radius:22px;
  border:1px solid var(--border);
  padding:20px;
  box-shadow:var(--shadow);
}

.question-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.question-number{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.question{
  font-size:19px;
  line-height:1.45;
  font-weight:850;
  color:var(--dark);
  margin-bottom:18px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:#fff;
  border:1.5px solid #dfe3eb;
  padding:13px;
  border-radius:14px;
  margin:8px 0;
  transition:.15s;
}

.option:hover{
  border-color:var(--primary);
  background:#f8f8ff;
}

.option.correct{
  background:#ecfdf5;
  border-color:#10b981;
  color:#065f46;
}

.option.wrong{
  background:#fef2f2;
  border-color:#ef4444;
  color:#991b1b;
}

.explanation{
  margin-top:15px;
  padding:14px;
  background:#f8fafc;
  border-left:4px solid var(--primary);
  border-radius:10px;
  line-height:1.55;
  font-size:13px;
}

/* TERMS */

.term-row{
  border-bottom:1px solid var(--border);
  padding:13px 0;
}

.term-row:last-child{
  border-bottom:0;
}

.term-tech{
  font-weight:850;
  color:var(--primary);
}

.term-patient{
  margin-top:4px;
  font-size:13px;
}

.search{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:white;
}

.search:focus{
  border-color:var(--primary);
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,
td{
  padding:11px 8px;
  text-align:left;
  border-bottom:1px solid var(--border);
  vertical-align:top;
}

th{
  color:var(--dark);
  background:#f8fafc;
}

/* CASE */

.case-header{
  background:linear-gradient(135deg,#eef2ff,#faf5ff);
  padding:17px;
  border-radius:17px;
  margin-bottom:15px;
}

.case-title{
  font-size:20px;
  font-weight:900;
  color:var(--dark);
}

.case-info{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:13px;
}

.case-info div{
  background:white;
  padding:10px;
  border-radius:11px;
  font-size:12px;
}

.case-info strong{
  display:block;
  margin-bottom:3px;
}

/* FORM */

textarea,
input[type="text"]{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px;
  resize:vertical;
  outline:none;
}

textarea:focus,
input[type="text"]:focus{
  border-color:var(--primary);
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:min(820px,100%);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50;
}

.nav-item{
  border:0;
  background:none;
  color:#8a91a0;
  font-size:10px;
  font-weight:700;
  padding:5px 2px;
}

.nav-item span{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav-item.active{
  color:var(--primary);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-sheet{
  width:min(820px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:27px 27px 0 0;
  padding:22px;
  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-close{
  float:right;
  border:0;
  background:#f3f4f6;
  border-radius:50%;
  width:35px;
  height:35px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:white;
  padding:11px 16px;
  border-radius:999px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:500px){
  .hero{
    padding:22px 15px;
  }

  .logo h1{
    font-size:21px;
  }

  .stats{
    gap:6px;
  }

  .premium-features{
    grid-template-columns:1fr;
  }

  .case-info{
    grid-template-columns:1fr;
  }

  .quick-grid{
    gap:8px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="hero">
  <div class="hero-top">
    <div class="logo">
      <div class="logo-icon">⚕️</div>
      <div>
        <h1>FSP Apotheker</h1>
        <p>Deutsch für die Fachsprachenprüfung</p>
      </div>
    </div>

    <div class="premium-status">
      ✦ PREMIUM<br>
      <span style="font-weight:500">bald verfügbar</span>
    </div>
  </div>

  <div class="hero-progress">
    <div class="hero-progress-top">
      <span>Gesamtfortschritt</span>
      <span id="headerProgress">0%</span>
    </div>
    <div class="progress">
      <div id="headerProgressBar" style="width:0%"></div>
    </div>
  </div>
</header>

<main id="main"></main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="navigate('home')">
    <span>🏠</span>Start
  </button>
  <button class="nav-item" data-page="lernen" onclick="navigate('lernen')">
    <span>📚</span>Lernen
  </button>
  <button class="nav-item" data-page="faelle" onclick="navigate('faelle')">
    <span>🩺</span>Fälle
  </button>
  <button class="nav-item" data-page="pruefung" onclick="navigate('pruefung')">
    <span>🎓</span>Prüfung
  </button>
  <button class="nav-item" data-page="profil" onclick="navigate('profil')">
    <span>👤</span>Profil
  </button>
</nav>

</div>

<div id="modal" class="modal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<div id="toast" class="toast"></div>

  localStorage.setItem("fspPremiumState",JSON.stringify(state));
}

function addXP(amount,key){
  if(key && state.questionXP[key]) return false;

  if(key){
    state.questionXP[key]=true;
  }

  state.xp += amount;
  saveState();
  updateHeader();
  toast("+" + amount + " XP erhalten 🎉");
  return true;
}

function getTotalQuestions(){
  return lesson1Questions.length +
         lesson2Questions.length +
         lesson3Questions.length +
         lesson5Questions.length +
         listeningQuestions.length;
}

function getCompletedCount(){
  return Object.keys(state.questionXP).length;
}

function getProgress(){
  const total = lessons.length + 8;
  const completed =
    Object.keys(state.completedLessons).length +
    Object.keys(state.completedCases).length;

  return Math.min(100,Math.round((completed / total) * 100));
}

function updateHeader(){
  const p = getProgress();
  document.getElementById("headerProgress").textContent = p + "%";
  document.getElementById("headerProgressBar").style.width = p + "%";
}

function navigate(page){
  document.querySelectorAll(".nav-item").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  if(page==="home") renderHome();
  if(page==="lernen") renderLessons();
  if(page==="faelle") renderCases();
  if(page==="pruefung") renderExam();
  if(page==="profil") renderProfile();

  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================================
   QUIZ ENGINE
========================================================= */

let quizData=[];
let quizIndex=0;
let quizScore=0;
let quizKey="";

function startQuiz(type){

  if(type==="lesson1"){
    quizData=lesson1Questions;
    quizKey="l1";
  }

  if(type==="lesson2"){
    quizData=lesson2Questions;
    quizKey="l2";
  }

  if(type==="lesson3"){
    quizData=lesson3Questions;
    quizKey="l3";
  }

  if(type==="lesson5"){
    quizData=lesson5Questions;
    quizKey="l5";
  }

  quizIndex=0;
  quizScore=0;

  showQuizQuestion();
}

function showQuizQuestion(){

  if(quizIndex>=quizData.length){
    finishQuiz();
    return;
  }

  const item=quizData[quizIndex];

  document.getElementById("main").innerHTML=`

    <button class="btn btn-light" onclick="renderLesson1()">
      ← Zurück
    </button>

    <div style="margin-top:15px">

      <div class="question-card">

        <div class="question-meta">
          <span class="badge">
            ${quizKey.toUpperCase()}
          </span>

          <span class="question-number">
            Frage ${quizIndex+1} von ${quizData.length}
          </span>
        </div>

        <div class="progress" style="background:#eef2f7;margin-bottom:18px">
          <div style="
            width:${((quizIndex)/quizData.length)*100}%;
            background:linear-gradient(90deg,var(--primary),var(--primary2));
          "></div>
        </div>

        <div class="question">
          ${item.q}
        </div>

        <div id="options">
          ${item.options.map((option,i)=>`
            <button class="option"
                    onclick="answerQuestion(${i})">
              <b>${String.fromCharCode(65+i)}.</b>
              ${option}
            </button>
          `).join("")}
        </div>

        <div id="explanationArea"></div>

      </div>

    </div>
  `;
}

function answerQuestion(index){

  const item=quizData[quizIndex];
  const buttons=document.querySelectorAll(".option");

  buttons.forEach((btn,i)=>{
    btn.disabled=true;

    if(i===item.answer){
      btn.classList.add("correct");
    }

    if(i===index && i!==item.answer){
      btn.classList.add("wrong");
    }
  });

  if(index===item.answer){
    quizScore++;
    addXP(10,quizKey+"-"+quizIndex);
  }else{
    state.hearts=Math.max(0,state.hearts-1);
    saveState();
  }

  document.getElementById("explanationArea").innerHTML=`
    <div class="explanation">
      <b>${index===item.answer ? "✅ Richtig!" : "❌ Nicht ganz."}</b>
      <br><br>
      ${item.explanation}
    </div>

    <button class="btn btn-primary btn-block"
            style="margin-top:12px"
            onclick="nextQuizQuestion()">
      ${quizIndex===quizData.length-1 ? "Ergebnis anzeigen" : "Nächste Frage →"}
    </button>
  `;
}

function nextQuizQuestion(){
  quizIndex++;
  showQuizQuestion();
}

function finishQuiz(){

  const percent=Math.round((quizScore/quizData.length)*100);

  document.getElementById("main").innerHTML=`

    <div class="card" style="text-align:center;padding:30px 20px">

      <div style="font-size:55px">
        ${percent>=80 ? "🏆" : percent>=60 ? "👏" : "💪"}
      </div>

      <h2>
        Quiz abgeschlossen
      </h2>

      <div class="big-number">
        ${quizScore}/${quizData.length}
      </div>

      <p class="muted">
        ${percent}% richtig
      </p>

      <div class="progress" style="background:#eef2f7;margin:20px 0">
        <div style="
          width:${percent}%;
          background:linear-gradient(90deg,var(--primary),var(--primary2));
        "></div>
      </div>

      <p class="small muted">
        ${percent>=80
          ? "Sehr gute Leistung. Du beherrschst die Grundlagen bereits sicher."
          : percent>=60
          ? "Gute Basis. Wiederhole die Fragen mit Fehlern noch einmal."
          : "Nutze die Erklärungen und trainiere die Fragen erneut."
        }
      </p>

      <button class="btn btn-primary btn-block"
              onclick="renderLesson1()">
        Zur Lektion
      </button>

      <button class="btn btn-light btn-block"
              style="margin-top:8px"
              onclick="startQuiz('${quizKey==='l1'?'lesson1':quizKey==='l2'?'lesson2':quizKey==='l3'?'lesson3':'lesson5'}')">
        Quiz wiederholen
      </button>

    </div>
  `;
}

/* =========================================================

========================================================= */

function openListening(){

  let index=0;
  let score=0;

  function showListening(){

    const item=listeningQuestions[index];

    openModal(`

      <button class="modal-close" onclick="closeModal()">×</button>

      <span class="badge premium">
        ✦ PREMIUM
      </span>

      <h2>🎧 Hörverständnis</h2>

      <p class="small muted">
        Gespräch ${index+1} von ${listeningQuestions.length}
      </p>

      <div class="card">

        <h3>${item.title}</h3>

        <button class="btn btn-secondary"
                onclick="speakText(\`${item.text.replace(/`/g,"'")}\`)">
          🔊 Gespräch vorlesen
        </button>

        <p class="small muted" style="margin-top:15px">
          Höre zuerst zu und beantworte anschließend die Frage.
        </p>

        <div class="question">
          ${item.q}
        </div>

        ${item.options.map((o,i)=>`
          <button class="option"
                  onclick="answerListening(${i},${item.answer})">
            ${o}
          </button>
        `).join("")}

      </div>

    `);

    window.answerListening=function(choice,answer){

      const buttons=document.querySelectorAll("#modalContent .option");

      buttons.forEach((b,i)=>{
        b.disabled=true;

        if(i===answer){
          b.classList.add("correct");
        }

        if(i===choice && i!==answer){
          b.classList.add("wrong");
        }
      });

      if(choice===answer){
        score++;
        addXP(15,"listening-"+index);
      }

      const next=index+1;

      setTimeout(()=>{

        if(next<listeningQuestions.length){
          index=next;
          showListening();
        }else{

          openModal(`

            <button class="modal-close" onclick="closeModal()">×</button>

            <div style="text-align:center">

              <div style="font-size:50px">🎧</div>

              <h2>Hörverständnis beendet</h2>

              <div class="big-number">
                ${score}/${listeningQuestions.length}
              </div>

              <p class="muted">
                Gute Arbeit!
              </p>

              <button class="btn btn-primary btn-block"
                      onclick="closeModal()">
                Schließen
              </button>

            </div>
          `);

        }

      },700);
    };
  }

  showListening();
}


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakText(text){

  if(!("speechSynthesis" in window)){
    toast("Vorlesefunktion wird von diesem Browser nicht unterstützt.");
    return;
  }

  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(text);

  utterance.lang="de-DE";
  utterance.rate=.88;
  utterance.pitch=1;

  speechSynthesis.speak(utterance);
}

========================================================= */

function openModal(content){

  document.getElementById("modalContent").innerHTML=content;
  document.getElementById("modal").classList.add("show");
}

function closeModal(event){

  if(event && event.target!==document.getElementById("modal")){
    return;
  }

  document.getElementById("modal").classList.remove("show");
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

    <div class="section-title">
      Lernzentrum 📚
    </div>

    <div class="section-subtitle">
      Alle Lernbereiche an einem Ort.
    </div>

    <div class="quick-grid">

      <div class="quick clickable"
           onclick="openTerms()">
        <div class="quick-icon">📖</div>
        <strong>Fachbegriffe</strong>
        <span>36+ Begriffe</span>
      </div>

      <div class="quick clickable"
           onclick="startQuiz('lesson1')">
        <div class="quick-icon">🧠</div>
        <strong>Quiz</strong>
        <span>20 Fragen</span>
      </div>

      <div class="quick clickable"
           onclick="showPremiumInfo()">
        <div class="quick-icon">🎧</div>
        <strong>Hörverständnis</strong>
        <span>Premium</span>
      </div>

      <div class="quick clickable"
           onclick="showPremiumInfo()">
        <div class="quick-icon">💬</div>
        <strong>Fachgespräch</strong>
        <span>Premium</span>
      </div>

    </div>

    <div style="margin-top:18px">
      ${lessons.map(l=>`

        <div class="card clickable"
             onclick="${l.free ? `openLesson(${l.id})` : `showPremiumInfo()`}">

          <div class="card-header">

            <div>
              <span class="badge ${l.free ? "green":"premium"}">
                ${l.free ? "KOSTENLOS":"✦ PREMIUM"}
              </span>

              <h3 style="margin-top:8px">
                ${l.icon} ${l.title}
              </h3>

              <p class="small muted">
                ${l.subtitle}
              </p>
            </div>

            <div>
              ${l.free ? "▶️":"🔒"}
            </div>

          </div>

        </div>

      `).join("")}
    </div>
  `;
}


/* =========================================================
   OVERRIDE NAV LEARNING WITH EXTENDED VERSION
========================================================= */

function renderLessons(){
  renderEnhancedLearning();
  updateHeader();
}


/* =========================================================
   INIT
========================================================= */

function init(){

  updateHeader();

  renderHome();

  /*
    PREMIUM STATUS:
    bewusst NICHT AKTIVIERT.
    Keine Zahlung.
    Keine Zahlungsdaten.
    Keine Freischaltung.
  */

  saveState();
}

init();

</script>
