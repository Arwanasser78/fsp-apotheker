<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSP Apotheker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
}

header{
  background:#fff;
  padding:18px;
  border-bottom:1px solid #e5e7eb;
  position:sticky;
  top:0;
  z-index:5;
}

.brand{
  font-weight:800;
  font-size:21px;
}

.sub{
  font-size:12px;
  color:#718096;
}

.stats{
  position:absolute;
  right:14px;
  top:18px;
  display:flex;
  gap:6px;
}

.pill{
  background:#eef2ff;
  padding:7px 9px;
  border-radius:99px;
  font-size:12px;
  font-weight:700;
}

main{
  padding:18px 16px 95px;
}

.hero{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;
  border-radius:22px;
  padding:22px;
}

.hero h1{
  margin:0 0 8px;
}

.hero p{
  line-height:1.55;
}

.btn{
  background:#4338ca;
  color:#fff;
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  opacity:.92;
}

.hero .btn{
  background:#fff;
  color:#3348bd;
}

.section{
  margin-top:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card,.case,.lesson{
  background:#fff;
  border:1px solid #e5e9f0;
  border-radius:18px;
  padding:16px;
}

.card{
  cursor:pointer;
}

.icon{
  font-size:27px;
}

.card h3{
  font-size:15px;
  margin:8px 0 4px;
}

.muted{
  color:#6b778c;
}

.lesson{
  display:flex;
  align-items:center;
  gap:12px;
  margin:10px 0;
}

.num{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#eef2ff;
  color:#4338ca;
  display:grid;
  place-items:center;
  font-weight:800;
  flex-shrink:0;
}

.lesson>div:nth-child(2){
  flex:1;
}

.lesson small{
  display:block;
  color:#718096;
  margin-top:3px;
}

.case{
  margin:10px 0;
}

.tag{
  display:inline-block;
  background:#eef2ff;
  color:#4338ca;
  border-radius:99px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800;
}

.case h3{
  margin:10px 0 5px;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:760px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:8px 4px;
  z-index:10;
}

.nav button{
  border:0;
  background:none;
  color:#718096;
  font-size:11px;
  cursor:pointer;
}

.nav button.active{
  color:#4338ca;
  font-weight:800;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#11182788;
  align-items:flex-end;
  z-index:20;
}

.sheet{
  background:#fff;
  width:100%;
  max-width:760px;
  margin:auto;
  border-radius:24px 24px 0 0;
  padding:22px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  border:0;
  border-radius:50%;
  width:34px;
  height:34px;
  cursor:pointer;
  font-size:20px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  background:#f5f7fb;
  padding:14px;
  border-radius:12px;
  margin:8px 0;
  cursor:pointer;
  font:inherit;
}

.option:hover{
  background:#e9edff;
}

.answer{
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
}

.correct{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  color:#065f46;
}

.wrong{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
}

.dialogue{
  background:#f8fafc;
  border-left:4px solid #4f46e5;
  padding:13px;
  border-radius:10px;
  margin:10px 0;
  line-height:1.6;
}

.progress{
  background:#e5e7eb;
  height:9px;
  border-radius:99px;
  overflow:hidden;
  margin:10px 0 16px;
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,#2563eb,#4f46e5);
  border-radius:99px;
}

.small{
  font-size:12px;
  color:#718096;
}

.success{
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  color:#065f46;
  padding:14px;
  border-radius:14px;
  margin:12px 0;
}

.warning{
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:14px;
  border-radius:14px;
  margin:12px 0;
}

.info{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  padding:14px;
  border-radius:14px;
  margin:12px 0;
}

.sheet textarea,
textarea{
  width:100%;
  min-height:160px;
  border:1px solid #d8dee8;
  border-radius:14px;
  padding:12px;
  font:inherit;
  resize:vertical;
}

hr{
  border:0;
  border-top:1px solid #e5e7eb;
  margin:20px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  margin:12px 0;
  font-size:13px;
}

th,td{
  border:1px solid #e5e7eb;
  padding:10px;
  text-align:left;
  vertical-align:top;
}

th{
  background:#f8fafc;
}

.topic{
  background:#f8fafc;
  border-radius:14px;
  padding:13px;
  margin:9px 0;
}

.topic b{
  display:block;
  margin-bottom:4px;
}

.score{
  font-size:28px;
  font-weight:800;
  color:#4338ca;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">FSP Apotheker</div>
  <div class="sub">Deutsch für die Fachsprachenprüfung</div>

  <div class="stats">
    <span class="pill">⭐ <b id="xp">0</b></span>
    <span class="pill">🔥 1</span>
    <span class="pill">❤️ 5</span>
  </div>
</header>

<main id="main"></main>

<nav class="nav">
  <button data-p="home">🏠<br>Start</button>
  <button data-p="path">🗺️<br>Lernpfad</button>
  <button data-p="cases">💬<br>Fälle</button>
  <button data-p="exam">🎓<br>Prüfung</button>
  <button data-p="profile">👤<br>Profil</button>
</nav>

<div id="modal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeM()">×</button>
    <div id="mb"></div>
  </div>
</div>

</div>

/* =====================================================
   SPEICHER
===================================================== */

let xp=Number(localStorage.getItem('fspxp')||0);

let progressData=JSON.parse(
  localStorage.getItem('fspProgress')||'{}'
);

function getProgress(lesson){
  return Array.isArray(progressData[lesson])
    ? progressData[lesson]
    : [];
}

function setProgress(lesson,data){
  progressData[lesson]=data;
  localStorage.setItem(
    'fspProgress',
    JSON.stringify(progressData)
  );
}

function addXP(amount){
  xp+=amount;
  localStorage.setItem('fspxp',xp);
  $('xp').textContent=xp;
}

function save(){
  localStorage.setItem('fspxp',xp);
  $('xp').textContent=xp;
}

function $(id){
  return document.getElementById(id);
}

/* =====================================================
   NAVIGATION
===================================================== */

function render(page='home'){

  document.querySelectorAll('.nav button')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.p===page
      );
    });

  const m=$('main');

  if(page==='home'){

    const p1=Math.round(getProgress(1).length/20*100);
    const p2=Math.round(getProgress(2).length/20*100);
    const p3=Math.round(getProgress(3).length/20*100);

    m.innerHTML=`

      <section class="hero">

        <h1>Bereit für die FSP?</h1>

        <p>
          Trainiere Patientengespräche, Fachgespräche
          und pharmazeutische Dokumentation mit
          realistischen Situationen aus dem
          Apothekenalltag.
        </p>

        <button class="btn"
          onclick="openLesson(1)">
          Lernen starten →
        </button>

      </section>

      <section class="section">

        <h2>Dein Lernpfad</h2>

        <div class="grid">

          ${[
            [1,'🗣️','Patientengespräch',p1],
            [2,'👩‍⚕️','Fachgespräch',p2],
            [3,'📝','Dokumentation',p3]
          ].map(x=>`

            <div class="card"
              onclick="openLesson(${x[0]})">

              <div class="icon">${x[1]}</div>

              <h3>
                Lektion ${x[0]} – ${x[2]}
              </h3>

              <div class="progress">
                <div style="width:${x[3]}%"></div>
              </div>

              <p class="muted">
                ${x[3]} % abgeschlossen
              </p>

            </div>

          `).join('')}

        </div>

      </section>

      <section class="section">

        <div class="card">

          <h3>⭐ Dein Fortschritt</h3>

          <p class="muted">
            ${xp} XP gesammelt
          </p>

          <p>
            Ziel: sichere, strukturierte und
            professionelle Kommunikation in der FSP.
          </p>

        </div>

      </section>

    `;
  }


  if(page==='path'){

    m.innerHTML=`

      <h1>🗺️ Lernpfad</h1>

      <p class="muted">
        Arbeite dich Schritt für Schritt durch
        die wichtigsten kommunikativen Aufgaben
        für die FSP.
      </p>

      ${[1,2,3,4,5,6].map(i=>{

        const x=L[i-1];

        return `

          <div class="lesson">

            <div class="num">${i}</div>

            <div>
              <b>${x[2]} ${x[0]}</b>
              <small>${x[1]}</small>
            </div>

            <button class="btn"
              onclick="openLesson(${i})">
              Öffnen
            </button>

          </div>

        `;

      }).join('')}

    `;
  }


  if(page==='cases'){

    m.innerHTML=`

      <h1>💬 Praxisfälle</h1>

      <p class="muted">
        Realistische Situationen aus der Apotheke.
      </p>

      ${C.map((x,i)=>`

        <div class="case">

          <span class="tag">

function revealLessonAnswer(lesson,n){

  const questions=
    lesson===1 ? L1Q :
    lesson===2 ? L2Q :

  const q=questions[n];
  const done=getProgress(lesson).includes(n);

  $('lessonAnswer').innerHTML=`

    <div class="answer correct">

      <b>✅ Musterantwort</b>

      <p>${q[1]}</p>

      ${
        done
        ? `<span class="small">
             Bereits abgeschlossen.
           </span>`
        : `<button class="btn"
             onclick="completeLessonQuestion(${lesson},${n})">
             ✓ Als gelernt markieren
           </button>`
      }

    </div>
  `;
}

function completeLessonQuestion(lesson,n){

  let data=getProgress(lesson);

  if(!data.includes(n)){

    data.push(n);

    setProgress(lesson,data);

    addXP(10);
  }

  questionLesson(lesson,n+1);
}

      Fall auswerten
    </button>

  `;

  $('modal').style.display='flex';
}

function finishCase(){

  const value=
    ($('caseText')?.value||'').trim();

  if(value.length<30){

    alert(
      'Bitte formuliere mindestens einige vollständige Sätze.'
    );

    return;
  }

  addXP(15);

  $('mb').innerHTML=`

    <div class="success">
      ✅ Fall bearbeitet. +15 XP
    </div>

    <h3>FSP-Checkliste</h3>

    <ul>
      <li>professioneller Einstieg</li>
      <li>strukturierte Anamnese</li>
      <li>relevante Arzneimittel</li>
      <li>Allergien / Unverträglichkeiten</li>
      <li>Beratung</li>
      <li>Warnzeichen</li>
      <li>Verständnisprüfung</li>
      <li>Abschluss</li>
    </ul>

    <button class="btn"
      onclick="closeM()">
      Schließen
    </button>

  `;
}


/* =====================================================
   PRÜFUNG
===================================================== */

function evaluateExam(){

  const text=
    ($('examAnswer')?.value||'').trim();

  if(text.length<60){

    $('examResult').innerHTML=`

      <div class="warning">
        Deine Antwort ist noch sehr kurz.
        Versuche, eine vollständige strukturierte
        Antwort zu formulieren.
      </div>

    `;

    return;
  }

  const t=text.toLowerCase();

  let points=0;

  if(t.includes('metformin')) points++;
  if(t.includes('niere')) points++;
  if(t.includes('medikation')) points++;
  if(t.includes('einnahme')||t.includes('dos')) points++;
  if(t.includes('arzt')||t.includes('ärzt')) points++;

  addXP(20);

  $('examResult').innerHTML=`

    <div class="success">
      ✅ Prüfungsteil abgeschlossen.
      <br><br>
      +20 XP
    </div>

    <div class="answer">

      <b>Automatischer Themencheck:</b>

      <p>
        Erkannte Kernpunkte:
        <strong>${points}/5</strong>
      </p>

      <ul>
        <li>Medikation</li>
        <li>Nierenfunktion</li>
        <li>Dosierung / Einnahme</li>
        <li>Beratung</li>
        <li>ärztliche Rücksprache</li>
      </ul>

    </div>

  `;
}


/* =====================================================
   MODAL
===================================================== */

function closeM(){
  $('modal').style.display='none';
}

$('modal').addEventListener(
  'click',
  function(e){
    if(e.target===$('modal')){
      closeM();
    }
  }
);


/* =====================================================
   NAVIGATION
===================================================== */

document
  .querySelectorAll('.nav button')
  .forEach(button=>{
    button.onclick=()=>{
      render(button.dataset.p);
    };
  });


/* =====================================================
   RESET
===================================================== */

function resetAll(){

  if(!confirm(
    'Möchtest du wirklich deinen gesamten Lernfortschritt löschen?'
  )){
    return;
  }

  xp=0;
  progressData={};

  localStorage.removeItem('fspxp');
  localStorage.removeItem('fspProgress');

  localStorage.removeItem('l1bonus');
  localStorage.removeItem('priceBonus');
  localStorage.removeItem('mini1done');
  localStorage.removeItem('mini2done');
  localStorage.removeItem('mini3done');

  save();

  render('profile');
}


/* =====================================================
   START
===================================================== */

save();
render('home');

</script>

</body>
</html>
