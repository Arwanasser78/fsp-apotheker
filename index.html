function saveState(){
  localStorage.setItem("fspxp",state.xp);
  localStorage.setItem("fsphearts",state.hearts);
  localStorage.setItem("fspstreak",state.streak);
  localStorage.setItem("fspPremium",state.premium);
  localStorage.setItem("fspCompleted",JSON.stringify(state.completed));
  localStorage.setItem("fspQuestionStats",JSON.stringify(state.questionStats));
  localStorage.setItem("fspBonuses",JSON.stringify(state.bonuses));
  localStorage.setItem("fspLastVisit",state.lastVisit);
}

function esc(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}

function addXP(amount,reason,key=null){

  if(key && state.bonuses[key]){
    return;
  }

  if(key){
    state.bonuses[key]=true;
  }

  state.xp += amount;

  saveState();

  updateHeader();

  toast("+"+amount+" XP"+(reason ? " · "+reason : ""));
}

function updateHeader(){

  document.getElementById("topXP").textContent=state.xp;
  document.getElementById("topStreak").textContent=state.streak;
  document.getElementById("topHearts").textContent=state.hearts;

}

function isPremium(){
  return state.premium;
}

function requirePremium(){

  if(isPremium()){
    return true;
  }

  showPremiumModal();

  return false;
}

function navigate(page){

  currentPage=page;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function setActiveNav(){

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.remove("active");
  });

  const btn=document.getElementById("nav-"+currentPage);

  if(btn){
    btn.classList.add("active");
  }
}

function startQuestionLesson(id){

  state.currentQuestion=0;

  renderQuestion(id);

}

function renderQuestion(id){

  const questions=QUESTIONS[id];

  const index=state.currentQuestion;

  const item=questions[index];

  const answered=state.questionStats["l"+id+"q"+index];

  const progress=Math.round(
    (index/questions.length)*100
  );

  showContentPage(`

    <div class="card">

      <div class="progress-row">
        <span>Lektion ${id}</span>
        <strong>${index+1}/${questions.length}</strong>
      </div>

      <div class="progress">
        <div
          class="progress-bar"
          style="width:${progress}%"
        ></div>
      </div>

    </div>


    <div class="card">

      <div class="question-number">
        FRAGE ${index+1} VON ${questions.length}
      </div>

      <div class="question-text">
        ${esc(item.q)}
      </div>

      <div id="questionOptions">

        ${item.options.map((option,i)=>`

          <button
            class="option"
            id="option-${i}"
            onclick="answerQuestion(${id},${index},${i})"
          >
            ${String.fromCharCode(65+i)}. ${esc(option)}
          </button>

        `).join("")}

      </div>

      <div id="questionExplanation"></div>

    </div>

    <div class="card">

      <button
        class="btn btn-secondary"
        onclick="randomQuestion(${id})"
      >
        🎲 Zufällige Frage
      </button>

      <button
        class="btn btn-secondary"
        onclick="showLessonMenu(${id})"
      >
        ☰ Lektionsmenü
      </button>

    </div>

  `);

  if(answered){

    document.querySelectorAll(".option").forEach((button,i)=>{

      button.disabled=true;

      if(i===item.answer){
        button.classList.add("correct");
      }

    });

    document.getElementById("questionExplanation").innerHTML=`

      <div class="explanation">
        <strong>Bereits beantwortet.</strong><br>
        ${esc(item.explanation)}
      </div>

    `;

  }

}

function answerQuestion(id,index,choice){

  const key="l"+id+"q"+index;

  if(state.questionStats[key]){
    return;
  }

  const item=QUESTIONS[id][index];

  document.querySelectorAll(".option").forEach(button=>{
    button.disabled=true;
  });

  const selected=document.getElementById("option-"+choice);
  const correct=document.getElementById("option-"+item.answer);

  if(choice===item.answer){

    selected.classList.add("correct");

    state.questionStats[key]="correct";

    addXP(
      10,
      "Richtige Antwort",
      "xp_"+key
    );

  }else{

    selected.classList.add("wrong");
    correct.classList.add("correct");

    state.questionStats[key]="wrong";

    state.hearts=Math.max(0,state.hearts-1);

    saveState();

    updateHeader();

    toast("Nicht ganz. Die richtige Antwort ist markiert.");

  }

  document.getElementById("questionExplanation").innerHTML=`

    <div class="explanation">

      <strong>
        ${choice===item.answer ? "✓ Richtig!" : "ℹ Erklärung"}
      </strong>

      <br>

      ${esc(item.explanation)}

    </div>

    <button
      class="btn btn-primary btn-full"
      style="margin-top:10px"
      onclick="nextQuestion(${id})"
    >
      ${index+1<QUESTIONS[id].length ? "Nächste Frage →" : "Lektion abschließen 🎉"}
    </button>

  `;

}

function nextQuestion(id){

  if(state.currentQuestion < QUESTIONS[id].length-1){

    state.currentQuestion++;

    renderQuestion(id);

  }else{

    state.completed["lesson"+id]=true;

    saveState();

    addXP(
      100,
      "Lektion abgeschlossen",
      "lesson_complete_"+id
    );

    showCompletion(id);

  }

}

function randomQuestion(id){

  state.currentQuestion=
    Math.floor(Math.random()*QUESTIONS[id].length);

  renderQuestion(id);

}

function openRandomQuestion(){

  const available=[];

  QUESTIONS[1].forEach((_,i)=>available.push([1,i]));

  QUESTIONS[2].forEach((_,i)=>available.push([2,i]));

  QUESTIONS[3].forEach((_,i)=>available.push([3,i]));

  const selected=
    available[Math.floor(Math.random()*available.length)];

  if(selected[0]>1 && !isPremium()){

    showPremiumModal();

    return;

  }

  state.currentQuestion=selected[1];

  renderQuestion(selected[0]);

}

function showCompletion(id){

  showContentPage(`

    <div class="card center">

      <div style="font-size:55px">🎉</div>

      <h2>Lektion abgeschlossen!</h2>

function renderTerms(filter=""){

    item[0].toLowerCase().includes(f) ||
    item[1].toLowerCase().includes(f)
  );

  return filtered.map(item=>`

  `).join("") || `

    <p class="muted center">
      Kein Begriff gefunden.

}

function evaluateExam(){

  const patient=
    document.getElementById("examPatient").value.toLowerCase();

  const fach=
    document.getElementById("examFach").value.toLowerCase();

  const doc=
    document.getElementById("examDoc").value.toLowerCase();

  const term=
    document.getElementById("examTerm").value.toLowerCase();

  let score=0;
  let feedback=[];

  const patientKeywords=[
    "wie",
    "seit",
    "beschwerden",
    "medikament",
    "allerg",
    "fragen"
  ];

  const fachKeywords=[
    "prüfen",
    "rücksprache",
    "dosierung",
    "patient",
    "empfehlen"
  ];

  const docKeywords=[
    "patient",
    "beratung",
    "erklärt",
    "dosierung",
    "anwendung"
  ];

  const termKeywords=[
    "blutdruck",
    "hoch",
    "erhöht"
  ];

  const check=(text,keywords)=>{

    return keywords.filter(k=>text.includes(k)).length;

  };

  const p=check(patient,patientKeywords);
  const f=check(fach,fachKeywords);
  const d=check(doc,docKeywords);
  const t=check(term,termKeywords);

  score=p+f+d+t;

  if(p>=3){
    feedback.push("✓ Patientengespräch enthält wichtige Anamnesefragen.");
  }else{
    feedback.push("→ Ergänze mehr strukturierte Fragen zum Patientengespräch.");
  }

  if(f>=3){
    feedback.push("✓ Fachgespräch enthält fachliche Handlungsschritte.");
  }else{
    feedback.push("→ Begründe deine fachliche Empfehlung stärker.");
  }

  if(d>=3){
    feedback.push("✓ Dokumentation enthält mehrere relevante Angaben.");
  }else{
    feedback.push("→ Dokumentiere konkreter: Anlass, Beratung und Ergebnis.");
  }

  if(t>=2){
    feedback.push("✓ Hypertonie wurde verständlich erklärt.");
  }else{
    feedback.push("→ Erkläre Hypertonie beispielsweise als erhöhten Blutdruck.");
  }

  const max=18;
  const percent=Math.min(100,Math.round(score/max*100));

  document.getElementById("examResult").innerHTML=`

    <div class="card">

      <div class="center">

        <div style="font-size:45px">
          ${percent>=70 ? "🎉" : "📚"}
        </div>

        <h2>${percent}% Trainingsstand</h2>

        <p class="muted">
          Diese automatische Auswertung ist nur ein
          Lernwerkzeug und keine offizielle FSP-Bewertung.
        </p>

      </div>

      ${feedback.map(x=>`

        <div class="phrase">
          ${esc(x)}
        </div>

      `).join("")}

    </div>

  `;

  addXP(
    30,
    "Prüfungssimulation",
    "full_exam"
  );

}

/* ============================================================

============================================================ */

function speakText(text){

  if(!("speechSynthesis" in window)){

    toast("Die Vorlesefunktion wird von diesem Browser nicht unterstützt.");

    return;
  }

  window.speechSynthesis.cancel();

  const utterance=
    new SpeechSynthesisUtterance(text);

  utterance.lang="de-DE";
  utterance.rate=.9;
  utterance.pitch=1;

  window.speechSynthesis.speak(utterance);

}

function speakDialogue(){

  const text=
    "Apotheker: Guten Tag. Wie kann ich Ihnen helfen? " +
    "Patient: Ich habe seit gestern starke Kopfschmerzen. " +
    "Apotheker: Können Sie mir bitte genauer beschreiben, wie sich die Kopfschmerzen äußern? " +
    "Patient: Es fühlt sich eher drückend an. " +
    "Apotheker: Seit wann genau bestehen die Beschwerden? " +
    "Patient: Seit gestern Nachmittag. " +
    "Apotheker: Nehmen Sie derzeit regelmäßig Medikamente ein? " +
    "Patient: Nein. " +
    "Apotheker: Sind bei Ihnen Allergien oder Unverträglichkeiten bekannt? " +
    "Patient: Nein. " +
    "Apotheker: Haben Sie noch Fragen oder ist etwas unklar geblieben? " +
    "Patient: Nein, danke. " +
    "Apotheker: Sehr gerne. Ich wünsche Ihnen gute Besserung.";

  speakText(text);

}


/* ============================================================
   DAILY STREAK
============================================================ */

function updateStreak(){

  const today=
    new Date().toISOString().slice(0,10);

  if(!state.lastVisit){

    state.lastVisit=today;

    saveState();

    return;
  }

  if(state.lastVisit===today){
    return;
  }

  const previous=
    new Date(state.lastVisit);

  const current=
    new Date(today);

  const difference=
    Math.round(
      (current-previous)/(1000*60*60*24)
    );

  if(difference===1){

    state.streak++;

  }else if(difference>1){

    state.streak=1;

  }

  state.lastVisit=today;

  saveState();

}


/* ============================================================
   INITIALISIERUNG
============================================================ */
