<!-- ANMELDEN -->
<div id="loginBox" class="login-box">

  <h2>👤 Anmelden</h2>
  <p>Melde dich an, um deine Lernfortschritte zu speichern.</p>

  <input
    type="email"
    id="email"
    placeholder="E-Mail-Adresse"
  >

  <input
    type="password"
    id="password"
    placeholder="Passwort"
  >

  <button onclick="login()">
    Anmelden
  </button>

  <p id="loginMessage"></p>

</div>

<script>
function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  if (!email || !password) {
    message.innerText = "Bitte E-Mail und Passwort eingeben.";
    message.style.color = "red";
    return;
  }

  /*
   * DEMO-LOGIN
   * Dieser Login ist nur für die Oberfläche.
   * Er speichert keine echten Benutzerkonten.
   */

  localStorage.setItem("userEmail", email);

  message.innerText = "✅ Erfolgreich angemeldet!";
  message.style.color = "green";

  setTimeout(() => {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("userArea").style.display = "block";
    document.getElementById("userEmail").innerText = email;
  }, 500);
}

function logout() {

  localStorage.removeItem("userEmail");

  document.getElementById("loginBox").style.display = "block";
  document.getElementById("userArea").style.display = "none";
}

window.onload = function() {

  const email = localStorage.getItem("userEmail");

  if (email) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("userArea").style.display = "block";
    document.getElementById("userEmail").innerText = email;
  }
};
</script>


<!-- BENUTZERBEREICH -->
<div id="userArea" style="display:none;">

  <h2>👋 Willkommen!</h2>

  <p>
    Angemeldet als:
    <strong id="userEmail"></strong>
  </p>

  <button onclick="logout()">
    Abmelden
  </button>

</div>
