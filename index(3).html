<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP Apotheker</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:760px;margin:auto;min-height:100vh}header{background:#fff;padding:18px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:21px}.sub{font-size:12px;color:#718096}.stats{position:absolute;right:14px;top:18px;display:flex;gap:6px}.pill{background:#eef2ff;padding:7px 9px;border-radius:99px;font-size:12px;font-weight:700}main{padding:18px 16px 90px}.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white;border-radius:22px;padding:22px}.hero h1{margin:0 0 8px}.hero p{line-height:1.5}.btn{background:#4338ca;color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.hero .btn{background:#fff;color:#3348bd}.section{margin-top:24px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.case,.lesson{background:#fff;border:1px solid #e5e9f0;border-radius:18px;padding:16px}.card{cursor:pointer}.icon{font-size:27px}.card h3{font-size:15px;margin:8px 0 4px}.muted{color:#6b778c}.lesson{display:flex;align-items:center;gap:12px;margin:10px 0}.num{width:38px;height:38px;border-radius:12px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:800}.lesson>div:nth-child(2){flex:1}.lesson small{display:block;color:#718096;margin-top:3px}.case{margin:10px 0}.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}.case h3{margin:10px 0 5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px;z-index:10}.nav button{border:0;background:none;color:#718096;font-size:11px}.nav button.active{color:#4338ca;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#11182788;align-items:flex-end;z-index:20}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:24px 24px 0 0;padding:22px;max-height:85vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.option{display:block;width:100%;text-align:left;border:0;background:#f5f7fb;padding:13px;border-radius:12px;margin:8px 0}.sheet textarea,textarea{width:100%;min-height:160px;border:1px solid #d8dee8;border-radius:14px;padding:12px;font:inherit}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><div class="app"><header><div class="brand">FSP Apotheker</div><div class="sub">Deutsch für die Fachsprachenprüfung</div><div class="stats"><span class="pill">⭐ <b id="xp">0</b></span><span class="pill">🔥 1</span><span class="pill">❤️ 5</span></div></header><main id="main"></main><nav class="nav"><button data-p="home">🏠<br>Start</button><button data-p="path">🗺️<br>Lernpfad</button><button data-p="cases">💬<br>Fälle</button><button data-p="exam">🎓<br>Prüfung</button><button data-p="profile">👤<br>Profil</button></nav><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div></div></div><script>const L=[['Patientengespräch','Anamnese, Beschwerden und Beratung','🗣️'],['Fachgespräch','Kollegial und präzise kommunizieren','👩‍⚕️'],['Dokumentation','Strukturiert dokumentieren','📝'],['Fachbegriffe','Wichtige pharmazeutische Begriffe','📚'],['Sprechen & Formulieren','Sichere Formulierungen für die Prüfung','🎤'],['Hörverständnis','Gespräche und Anweisungen verstehen','🎧']];const C=[['Kopfschmerzen & Schmerzmittel','Patient möchte ein Schmerzmittel und berichtet über Begleitsymptome.'],['Metformin & Nierenfunktion','Patient fragt nach seiner Medikation und aktuellen Laborwerten.'],['Erkältung & Selbstmedikation','Patient sucht Rat bei Husten, Schnupfen und Fieber.'],['Schlafprobleme & pflanzliches Präparat','Patient wünscht eine pflanzliche Option gegen Schlafprobleme.'],['Fall dokumentieren','Du sollst ein Beratungsgespräch fachgerecht dokumentieren.'],['Kollegiales Übergabegespräch','Du übergibst einen pharmazeutischen Fall an eine Kollegin.']];let xp=+localStorage.fspxp||0;const $=x=>document.getElementById(x);function save(){localStorage.fspxp=xp;$('xp').textContent=xp}function render(p='home'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));let m=$('main');if(p==='home')m.innerHTML=`<section class="hero"><h1>Bereit für die FSP?</h1><p>Trainiere typische Situationen aus dem Apothekenalltag und verbessere deine Fachsprache Schritt für Schritt.</p><button class="btn" onclick="render('path')">Lernen starten →</button></section><section class="section"><h2>Empfohlen</h2><div class="grid">${L.slice(0,3).map((x,i)=>`<div class="card" onclick="lesson(${i})"><div class="icon">${x[2]}</div><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('')}</div></section><section class="section"><div class="card"><h3>Dein Fortschritt</h3><p class="muted">${xp} XP gesammelt</p></div></section>`;if(p==='path')m.innerHTML=`<h1>Lernpfad</h1><p class="muted">Vom Patientengespräch bis zur Prüfung.</p>${L.map((x,i)=>`<div class="lesson"><div class="num">${i+1}</div><div><b>${x[0]}</b><small>${x[1]}</small></div><button class="btn" onclick="lesson(${i})">Start</button></div>`).join('')}`;if(p==='cases')m.innerHTML=`<h1>Praxisfälle</h1><p class="muted">Realistische Situationen aus der Apotheke.</p>${C.map((x,i)=>`<div class="case"><span class="tag">FALL ${i+1}</span><h3>${x[0]}</h3><p class="muted">${x[1]}</p><button class="btn" onclick="cas(${i})">Fall starten</button></div>`).join('')}`;if(p==='exam')m.innerHTML=`<h1>Prüfungssimulation</h1><div class="card"><span class="tag">SIMULATION</span><h2>Diabetes Typ 2</h2><p class="muted">Ein Patient berichtet über Medikation, Einnahme und Fragen zur Nierenfunktion.</p><textarea id="ans" placeholder="Formuliere Anamnese, Beratung und Dokumentation..."></textarea><br><button class="btn" onclick="grade()">Antwort auswerten</button></div>`;if(p==='profile')m.innerHTML=`<h1>Profil</h1><div class="card"><h2>FSP-Lernprofil</h2><p class="muted">${xp} XP auf diesem Gerät gespeichert.</p><button class="btn" onclick="xp=0;save();render('profile')">Fortschritt zurücksetzen</button></div>`}function lesson(i){$('mb').innerHTML=`<span class="tag">LEKTION ${i+1}</span><h2>${L[i][2]} ${L[i][0]}</h2><p>${L[i][1]}</p><p><b>Welche Formulierung klingt professionell?</b></p><button class="option" onclick="finish()">Könnten Sie mir bitte beschreiben, seit wann die Beschwerden bestehen?</button><button class="option" onclick="finish()">Was fehlt Ihnen?</button><button class="option" onclick="finish()">Nehmen Sie halt etwas.</button>`;$('modal').style.display='flex'}function cas(i){$('mb').innerHTML=`<span class="tag">FALL ${i+1}</span><h2>${C[i][0]}</h2><p>${C[i][1]}</p><p><b>Deine Aufgabe:</b> Formuliere eine strukturierte fachsprachliche Antwort mit Anamnese, Beratung und Abschluss.</p><textarea placeholder="Deine Antwort..."></textarea><br><button class="btn" onclick="finishCase()">Fall abschließen</button>`;$('modal').style.display='flex'}function finish(){xp+=10;save();alert('+10 XP');closeM()}function finishCase(){xp+=15;save();alert('+15 XP');closeM()}function grade(){xp+=20;save();alert('Selbstcheck abgeschlossen. +20 XP');}function closeM(){$('modal').style.display='none'}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.p));save();render();</script></body></html>
